<!DOCTYPE html>

<title>Exam 11</title>

<link rel="stylesheet" href="../../../css/style.css">

<style>

.result-card{

    width:350px;
    margin:40px auto;
    padding:30px;
    text-align:center;

    background:white;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,0.15);

    font-family:Arial;

}


.result-card h2{

    font-size:30px;

    margin-bottom:25px;

}


.result-item{

    margin:15px;

    font-size:20px;

}


.result-score{

    font-size:40px;

    font-weight:bold;

    color:#2563eb;

}


.restart-btn{

    margin-top:25px;

    padding:12px 25px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:18px;

    cursor:pointer;

}


.restart-btn:hover{

    opacity:0.85;

}

.question-info{

    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:20px;

}


#options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:3px;

    max-width:500px;

    margin:10px auto;

}

#options button{

    padding:8px;

    min-height:40px;

    border-radius:8px;

    border:1px solid #cbd5e1;

    background:white;

    color:#111827;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    text-align:center;

    transition:0.2s;

}


#options button:hover{

    transform:scale(1.02);

    background:#f1f5f9;

}


.correct{

    background:#22c55e !important;

    color:white;

}


.wrong{

    background:#ef4444 !important;

    color:white;

}


.disabled{

    cursor:not-allowed;

}

#progressContainer{

    width:80%;

    height:12px;

    background:#e5e7eb;

    border-radius:20px;

    margin:10px auto 20px auto;

    overflow:hidden;

}


#progressBar{

    height:100%;

    width:0%;

    background:#2563eb;

    border-radius:20px;

    transition:0.4s;

}

#nextButton{

    margin:20px auto;

    display:block;

    padding:12px 30px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;

    cursor:pointer;

}


#nextButton:disabled{

    background:#94a3b8;

    cursor:not-allowed;

}

#questionStatus{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    margin:15px auto;

}


.status-item{

    width:35px;

    height:35px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

    background:#e5e7eb;

    color:#111827;

}


.status-current{

    background:#2563eb;

    color:white;

}


.status-correct{

    background:#22c55e;

    color:white;

}


.status-wrong{

    background:#ef4444;

    color:white;

}

#startScreen{

    max-width:500px;

    margin:50px auto;

    padding:30px;

    text-align:center;

    background:white;

    border-radius:20px;

    box-shadow:0 8px 20px rgba(0,0,0,0.12);

}


#startScreen h1{

    font-size:28px;

}


#startScreen p{

    font-size:18px;

}


#startButton{

    margin-top:20px;

    padding:14px 35px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.menu-btn{

    margin-top:10px;

    padding:12px 25px;

    width:100%;

    border:none;

    border-radius:10px;

    background:#16a34a;

    color:white;

    font-size:17px;

    cursor:pointer;

}

.menu-btn:hover{

    opacity:0.9;

}

/* 📱 Mobil uyumluluk */

@media screen and (max-width:600px){


    body{

        padding:10px;

    }


    #questionBox{

        width:100%;

        box-sizing:border-box;

    }


    #questionImage{

    display:block;

    width:100%;

    max-width:650px;

    height:auto;

    margin:15px auto;

    border-radius:12px;

}


    .question-info{

    text-align:center;

    font-size:20px;

    font-weight:bold;

    margin-bottom:10px;

    color:#1e293b;

}


    #progressContainer{

        width:95%;

        height:10px;

    }


    #options{

        width:100%;

        gap:6px;

        margin:10px auto;

    }


    #options button{

        width:100%;

        padding:12px;

        font-size:15px;

        min-height:42px;

    }


    #questionStatus{

        gap:5px;

    }


    .status-item{

        width:30px;

        height:30px;

        font-size:14px;

    }


    #timer{

        font-size:22px !important;

        text-align:center;

    }


    #nextButton{

    display:block;

    margin:20px auto;

    padding:10px 30px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:bold;

}


    .result-card{

        width:90%;

        padding:20px;

    }


    .result-score{

        font-size:35px;

    }

@media screen and (max-width:600px){

    #options{

        grid-template-columns:1fr;

    }

}

#questionBox{

    max-width:700px;

    margin:20px auto;

    padding:20px;

    background:white;

    border-radius:20px;

    box-shadow:0 8px 20px rgba(0,0,0,0.12);

}

}

</style>
